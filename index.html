<style>
:root { --bg:#14171a; --card:#1e2327; --line:#2f363c; --text:#eef1f3; --dim:#9aa5ae; --go:#35d07f; --maybe:#ffb020; --bad:#ff6b5e; --accent:#4aa8ff; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust:100%; }
body { padding:0 0 calc(110px + env(safe-area-inset-bottom)); }
button, input, select { font:inherit; color:inherit; }
header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--line); }
header h1 { font-size:17px; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header small { display:block; color:var(--dim); font-weight:400; font-size:12px; }
main { padding:12px 14px; max-width:640px; margin:0 auto; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:18px 0 8px; }
p { margin:8px 0; } .dim { color:var(--dim); } .small { font-size:13px; } .err { color:var(--bad); }
label { display:block; margin:12px 0 4px; font-size:14px; color:var(--dim); }
input[type=text], input[type=password], input[type=number], input[type=url], select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0f1214; min-height:48px; }
input:focus, select:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.check { display:flex; align-items:center; gap:10px; margin:12px 0; color:var(--text); font-size:16px; min-height:44px; }
.check input { width:24px; height:24px; flex:none; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#04121f; font-weight:600; }
.btn.danger { border-color:var(--bad); color:var(--bad); }
.btn.wide { width:100%; margin-top:14px; }
.btn.icon { min-width:48px; padding:10px; }
.btn[disabled] { opacity:.5; }
.row { display:flex; gap:10px; align-items:end; } .row > * { flex:1; min-width:0; } .row > .fit { flex:none; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
.stats { color:var(--dim); font-size:14px; margin:4px 0 0; }
.banner { border-radius:10px; padding:10px 12px; margin:10px 0; background:#2a2416; border:1px solid #5b4a1c; font-size:14px; }
.banner.bad { background:#2c1a18; border-color:#6b2d27; }
.cap { display:flex; gap:12px; align-items:center; cursor:pointer; }
.cap img.thumb, .cap .thumb { width:64px; height:64px; border-radius:8px; object-fit:cover; background:#0f1214; flex:none; }
.cap .t { flex:1; min-width:0; } .cap .t b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:700; letter-spacing:.03em; border:1px solid var(--line); color:var(--dim); margin-right:4px; }
.pill.go { background:var(--go); border-color:var(--go); color:#04210f; } .pill.maybe { background:var(--maybe); border-color:var(--maybe); color:#2a1a00; }
.pill.wait { border-color:var(--accent); color:var(--accent); } .pill.bad { border-color:var(--bad); color:var(--bad); }
.items { margin:10px 0 0; padding:0; list-style:none; border-top:1px solid var(--line); }
.item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
.item:last-child { border-bottom:0; }
.item img.crop { width:72px; height:108px; object-fit:cover; border-radius:6px; background:#0f1214; flex:none; }
.item.hit img.crop { width:96px; height:144px; }
.item .t { flex:1; min-width:0; } .item .t b { display:block; overflow-wrap:anywhere; }
.item.go { border-left:4px solid var(--go); padding-left:8px; } .item.maybe { border-left:4px solid var(--maybe); padding-left:8px; }
.net { font-weight:700; } .go .net { color:var(--go); } .maybe .net { color:var(--maybe); }
.dock { position:fixed; left:0; right:0; bottom:0; z-index:6; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg) 22%); display:flex; gap:10px; max-width:640px; margin:0 auto; }
.dock .shoot { flex:1; min-height:72px; font-size:20px; font-weight:700; border-radius:16px; background:var(--go); border:0; color:#04210f; }
.dock .btn.icon { min-height:72px; min-width:64px; border-radius:16px; }
#toast { position:fixed; left:14px; right:14px; top:64px; z-index:9; display:none; padding:12px 14px; border-radius:12px; background:var(--go); color:#04210f; font-weight:700; box-shadow:0 6px 24px #0008; }
#toast.show { display:block; } #toast.plain { background:#39424a; color:var(--text); font-weight:400; } #toast.bad { background:var(--bad); color:#2a0703; }
.spin { display:inline-block; width:14px; height:14px; border:2px solid var(--dim); border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px; margin-right:6px; }
@keyframes sp { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
